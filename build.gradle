plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}
group = 'xyz.tcreopargh'
version = '2.0.0-1.21.1'
base.archivesName = 'pouchofunknown-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.233'
    mods { pouchofunknown { sourceSet sourceSets.main } }
}
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.theillusivec4.top/' }
}
dependencies {
    if (project.hasProperty('astagesJar')) {
        compileOnly files(project.property('astagesJar'))
    } else {
        compileOnly 'maven.modrinth:astages:2.5.3-1.21.1'
    }
    if (project.hasProperty('curiosJar')) {
        compileOnly files(project.property('curiosJar'))
    } else {
        compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api'
    }
}
tasks.named('jar', Jar).configure { from('LICENSE') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
