plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
group = 'xyz.tcreopargh'
version = '2.0.0-1.20.1'
base.archivesName = 'pouchofunknown-forge'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}
repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.theillusivec4.top/' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    compileOnly fg.deobf('maven.modrinth:astages:2.5.3-1.20.1')
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.9.1+1.20.1')
}
tasks.named('jar', Jar).configure {
    from('LICENSE')
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
